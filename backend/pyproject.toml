[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "convera"
version = "1.1.0"
description = "CONVERA: Evidence-Driven Project Intelligence and Validation Pipeline"
readme = "README.md"
authors = [{ name = "Technopreneurship Program" }]
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0.0",
    "pydantic>=2.0",
    "python-dotenv",
    "rich",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-ra -q -m 'not live'"
markers = [
    "unit: Pure deterministic offline unit tests",
    "integration: Local integration tests with SQLite or mocked services",
    "live: External network tests requiring real API connectivity",
    "smoke: Lightweight egress and connectivity probe subset of live tests",
]

